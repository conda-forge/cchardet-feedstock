{% set version = "2.4.0" %}

package:
  name: cchardet
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/c/cchardet/cchardet-{{ version }}.tar.gz
  sha256: 7b062e7e92e5ab1a00aaf5c164d5f056daae648ba1f144082baf5b4c229b794e

build:
  number: 0
  script: {{ PYTHON }} -m pip install . -vv

requirements:
  build:
    - python                                 # [build_platform != target_platform]
    - cross-python_{{ target_platform }}     # [build_platform != target_platform]
    - cython                                 # [build_platform != target_platform]
    - {{ compiler('c') }}
    - {{ stdlib("c") }}
    - {{ compiler('cxx') }}
  host:
    - python
    - pip
    - setuptools
    - cython
  run:
    - python

test:
  requires:
    - pip
  commands:
    - pip check
  imports:
    - cchardet

about:
  home: https://github.com/PyYoshi/cChardet
  license_file: COPYING
  license: GPL-3.0
  license_family: GPL
  summary: cChardet is high speed universal character encoding detector
  dev_url: https://github.com/PyYoshi/cChardet
  doc_url: https://github.com/PyYoshi/cChardet

extra:
  recipe-maintainers:
    - pmlandwehr
    - Ryan-Dmello
